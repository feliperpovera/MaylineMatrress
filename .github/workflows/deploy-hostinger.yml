name: Deploy to Hostinger

# Runs the same bundle scripts/build-hostinger.sh produces locally, then
# uploads it over FTPS to the Hostinger account. Needs three repo secrets
# (Settings -> Secrets and variables -> Actions):
#   HOSTINGER_FTP_SERVER    e.g. ftp.maylinmattress.com (from hPanel > Files > FTP Accounts)
#   HOSTINGER_FTP_USERNAME  FTP username from hPanel
#   HOSTINGER_FTP_PASSWORD  FTP password from hPanel
# Until those secrets exist, this workflow will fail at the upload step —
# the site keeps running on whatever was last uploaded manually.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Hostinger bundle
        run: bash scripts/build-hostinger.sh

      - name: Upload to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy/hostinger/
          # Hostinger's primary-domain FTP root. If maylinmattress.com is an
          # addon/parked domain on this hosting account, change this to
          # /domains/maylinmattress.com/public_html/ instead.
          server-dir: /public_html/
